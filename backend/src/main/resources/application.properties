spring.application.name=el-volcan
server.address=127.0.0.1
server.port=8080
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/elvolcan;LOCK_TIMEOUT=10000;WRITE_DELAY=0}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.h2.console.enabled=${H2_CONSOLE:false}
app.cors.allowed-origin=http://localhost:5173
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=api-el-volcan
app.jwt.access-minutes=15
app.jwt.refresh-days=7
