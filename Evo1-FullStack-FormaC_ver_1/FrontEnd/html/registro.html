<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta</title>
    <link rel="stylesheet" href="../assets/estilos.css">
</head>
<body>
    <header>
        <h1>Distribuidora de gas El Volcán</h1>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="productos.html">Productos</a>
            <a href="pedido.html">Realizar pedido</a>
        </nav>
    </header>
    <main>
        <section>
            <h2>Crear cuenta de cliente</h2>
            <p>Regístrate para poder iniciar sesión y realizar tus pedidos</p>
            <form id="formularioRegistro" autocomplete="on">
                <label for="nombre">Nombre completo</label>
                <input
                    type="text"
                    id="nombre"
                    name="nombre"
                    placeholder="Juan Alberto Pérez Muñoz"
                    autocomplete="name"
                >
                <br><br>
                <label for="usuario">Nombre de usuario</label>
                <input
                    type="text"
                    id="usuario"
                    name="usuario"
                    placeholder="Elige un nombre de usuario"
                    autocomplete="username"
                >
                <br><br>
                <label for="password">Contraseña</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Mínimo 6 caracteres"
                    autocomplete="new-password"
                >
                <br><br>
                <label for="confirmarPassword">Confirmar contraseña</label>
                <input
                    type="password"
                    id="confirmarPassword"
                    name="confirmarPassword"
                    placeholder="Repite tu contraseña"
                    autocomplete="new-password"
                >
                <br><br>
                <button type="submit">Crear cuenta</button>
                <p id="mensaje"></p>
            </form>
            <p>¿Ya tienes cuenta? <a href="login.html">Inicia sesión aquí</a></p>
        </section>
    </main>
    <footer>
        <p>Gas El Volcan - Chillan</p>
        <p>2026. Gas El Volcan</p>
    </footer>
    <script src="../js/datos.js"></script>
    <script src="../js/registro.js"></script>
</body>
</html>
